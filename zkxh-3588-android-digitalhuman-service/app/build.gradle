plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

def envOrProperty = { name, defaultValue ->
    def propertyValue = project.findProperty(name)
    if (propertyValue != null && propertyValue.toString().trim()) {
        return propertyValue.toString()
    }
    def envValue = System.getenv(name)
    if (envValue != null && envValue.trim()) {
        return envValue
    }
    return defaultValue
}

android {
    namespace 'com.example.myapplication'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.myapplication"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SERVER_IP", "\"${envOrProperty('SERVER_IP', '127.0.0.1')}\""
        buildConfigField "String", "AUDIO_DEVICE_IP", "\"${envOrProperty('AUDIO_DEVICE_IP', 'localhost')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

